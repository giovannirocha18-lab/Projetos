# A IA confere as FOTOS dos produtos (pedido do Giovanni, 11/11/2026; robo/conferir-fotos.mjs, lib/iaFotos.js):
# foto que não é do produto do nome sai das buscas. Toda manhã, depois dos robôs da noite, com teto baixo (só produto
# novo); à mão (Run workflow) dá para escolher o teto, até US$ 4.
name: IA conferindo as fotos
on:
  schedule:
    # 09:50 UTC = 05:50 no horário do Giovanni (UTC-4) e 06:50 de Brasília: ele pediu "umas 6 da manhã do meu horário"
    # (11/11/2026). As buscas prontas da noite costumam acabar às 07:30 UTC (a janela do robô vai até as 10:00 UTC)
    - cron: "50 9 * * *"
  workflow_dispatch:
    inputs:
      teto:
        description: "Teto de gasto desta rodada em US$ (máximo 4)"
        type: string
        default: "0.50"
      minutos:
        description: "Tempo máximo em minutos (máximo 150)"
        type: string
        default: "30"
      aprovar:
        description: "Aprovar à mão a foto destes produtos (nome do produto; vários separados por |). Não usa a IA"
        type: string
        default: ""
      categorias:
        description: "Abrir também as 40 categorias (o que a rodada de toda manhã faz)"
        type: boolean
        default: false
      reconferir:
        description: "Só olhar de novo, uma a uma, as fotos já reprovadas (aprova as que não se confirmam)"
        type: boolean
        default: false
concurrency:
  group: conferir-fotos
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  fotos:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v5
        with:
          ref: claude/inspiring-hamilton-wafagr
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Abre as 40 categorias depois dos robôs da noite (ideia do Giovanni, 11/11/2026): a que ficou sem lista pronta é
      # montada aqui, antes dos visitantes da manhã. Não usa IA. Só na rodada de toda manhã (não nas rodadas à mão das fotos)
      - name: Abrir as categorias (deixa o site pronto para a manhã)
        if: ${{ github.event_name == 'schedule' || inputs.categorias }}
        continue-on-error: true
        run: node robo/abrir-categorias.mjs
      - name: Instalar o SDK da Anthropic e o redutor de fotos
        run: npm install --no-save --no-package-lock @anthropic-ai/sdk@1.3.0 sharp@0.35.5
      - name: IA conferindo as fotos
        run: node robo/conferir-fotos.mjs "$TETO" "$MINUTOS" ${{ inputs.aprovar && 'aprovar' || inputs.reconferir && 'reconferir' || '' }}
        env:
          TETO: ${{ inputs.teto || '0.50' }}
          MINUTOS: ${{ inputs.minutos || '30' }}
          APROVAR: ${{ inputs.aprovar }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
