<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Página provisória enquanto o site está em construção. A loja de verdade está em previa.html -->
  <meta name="robots" content="noindex, nofollow">
  <title>Vai pro Carrinho — Em breve</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --texto: #1c2430;
      --suave: #5d6878;
      --marca: #0f7b5f;
      --marca-fundo: #e3f4ee;
      --selo-texto: #fff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12161c;
        --texto: #e8ecf1;
        --suave: #9aa5b4;
        --marca: #34c495;
        --marca-fundo: #173a30;
        --selo-texto: #0b1f19;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--texto);
      line-height: 1.5;
      text-align: center;
    }

    .carrinho {
      width: 88px; height: 88px; margin: 0 auto 20px;
      display: grid; place-items: center;
      border-radius: 50%;
      background: var(--marca-fundo);
      color: var(--marca);
    }

    h1 { margin: 0; font-size: clamp(2rem, 7vw, 3rem); letter-spacing: -.02em; }

    .selo {
      display: inline-block; margin-top: 16px;
      font-size: .85rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
      padding: 4px 14px; border-radius: 999px;
      background: var(--marca); color: var(--selo-texto);
    }

    p { margin: 16px auto 0; max-width: 440px; color: var(--suave); }
  </style>
</head>
<body>
  <main>
    <div class="carrinho" aria-hidden="true">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="20" r="1.5"/>
        <circle cx="18" cy="20" r="1.5"/>
        <path d="M2 3h3l2.6 12.4a1.5 1.5 0 0 0 1.5 1.1h8.8a1.5 1.5 0 0 0 1.5-1.1L21 7H6.2"/>
      </svg>
    </div>
    <h1>Vai pro Carrinho</h1>
    <span class="selo">Em breve</span>
    <p>Estamos preparando os melhores achados da Shopee, do Mercado Livre e de outras lojas, tudo num só lugar. Volte logo!</p>
  </main>
</body>
</html>
