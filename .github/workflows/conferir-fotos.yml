# A IA confere as FOTOS dos produtos (pedido do Giovanni, 11/11/2026; robo/conferir-fotos.mjs, lib/iaFotos.js):
# foto que não é do produto do nome sai das buscas. Toda manhã, depois dos robôs da noite, com teto baixo (só produto
# novo); à mão (Run workflow) dá para escolher o teto, até US$ 4.
name: IA conferindo as fotos
on:
  schedule:
    - cron: "40 10 * * *" # 07:40 de Brasília (os robôs da noite acabam até as 07:00)
  workflow_dispatch:
    inputs:
      teto:
        description: "Teto de gasto desta rodada em US$ (máximo 4)"
        type: string
        default: "0.50"
      minutos:
        description: "Tempo máximo em minutos (máximo 150)"
        type: string
        default: "30"
concurrency:
  group: conferir-fotos
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  fotos:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v5
        with:
          ref: claude/inspiring-hamilton-wafagr
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Instalar o SDK da Anthropic e o redutor de fotos
        run: npm install --no-save --no-package-lock @anthropic-ai/sdk@1.3.0 sharp@0.35.5
      - name: IA conferindo as fotos
        run: node robo/conferir-fotos.mjs "$TETO" "$MINUTOS"
        env:
          TETO: ${{ inputs.teto || '0.50' }}
          MINUTOS: ${{ inputs.minutos || '30' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
