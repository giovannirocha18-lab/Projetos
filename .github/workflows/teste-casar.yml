# Teste (11/11/2026, pedido do Giovanni): a IA dizendo se dois anúncios de lojas diferentes são o mesmo produto
# (robo/teste-casar.mjs). Só lê as buscas do site e pergunta à IA; não grava nada. Gasto máximo: US$ 0,20.
# Para rodar: aba Actions > Teste da IA casando produtos > Run workflow
name: Teste da IA casando produtos
on:
  workflow_dispatch:
    inputs:
      pares:
        description: "Quantos pares perguntar (máximo 300)"
        type: string
        default: "160"
permissions:
  contents: read
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: claude/inspiring-hamilton-wafagr
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Instalar o SDK da Anthropic
        run: npm install --no-save --no-package-lock @anthropic-ai/sdk@1.3.0
      - name: IA casando produtos
        run: node robo/teste-casar.mjs "$PARES"
        env:
          PARES: ${{ inputs.pares || '160' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
