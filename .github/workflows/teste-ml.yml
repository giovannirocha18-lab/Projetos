# Teste da API do Mercado Livre (10/11/2026): mostra o que os anúncios do ML mandam (entrega Full, parcelas) e o tamanho
# da fila do ML. Só leitura. Para rodar: aba Actions > Teste do Mercado Livre > Run workflow
name: Teste do Mercado Livre

on:
  workflow_dispatch:
    inputs:
      fundo:
        description: "Busca funda: termos separados por | (ex.: smartphone samsung|celular samsung). Vazio = só a amostra"
        default: ""
      fundas:
        description: "Rodar agora a lista inteira das buscas fundas da noite (escreva sim)"
        default: ""
      fichas:
        description: "Até quantas fichas do catálogo por termo (96 a 480)"
        default: "240"

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # Busca funda (17/11/2026): repete a chamada enquanto o Mercado Livre der limite (429), esperando 1 minuto
      - name: Busca funda no catálogo do ML
        if: ${{ inputs.fundo != '' }}
        run: |
          IFS='|' read -ra TERMOS <<< "$FUNDO"
          for t in "${TERMOS[@]}"; do
            echo "== $t"
            for volta in $(seq 1 15); do
              r=$(curl -sS --max-time 120 -G -H "Authorization: Bearer $CHAVE_ROBO" --data-urlencode "fundo=$t" --data-urlencode "fichas=$FICHAS" --data-urlencode "horas=20" "https://vaiprocarrinho.com.br/api/preparar-ml" || echo '{"erro":"sem resposta"}')
              echo "$r" | jq -c '{fundo, fichas, produtos, batem, consultas, precos, limite, continua, erro, segundos}' || echo "$r" | head -c 300
              if echo "$r" | jq -e '.limite == true or (.erro // "" | test("sem resposta|1101|Too many|subrequest"))' > /dev/null 2>&1; then sleep 60; elif echo "$r" | jq -e '.continua == true' > /dev/null 2>&1; then sleep 2; else break; fi
            done
          done
        env:
          CHAVE_ROBO: ${{ secrets.CHAVE_ROBO || secrets.ROBO_CHAVE }}
          FUNDO: ${{ inputs.fundo }}
          FICHAS: ${{ inputs.fichas }}
      # A lista inteira das buscas fundas (lib/mlFundas.js), como a fase "fundas" do robô da noite
      - name: Lista das buscas fundas
        if: ${{ inputs.fundas == 'sim' }}
        run: |
          parte=0; produtos=0; precos=0; esperas=0; feitas=0
          for volta in $(seq 1 3000); do
            r=$(curl -sS --max-time 120 -H "Authorization: Bearer $CHAVE_ROBO" "https://vaiprocarrinho.com.br/api/preparar-ml?fundas=1&parte=$parte&horas=30" || echo '{"erro":"sem resposta","limite":true}')
            p=$(echo "$r" | jq -r '.precos // 0' 2>/dev/null || echo 0); precos=$((precos + p))
            if echo "$r" | jq -e '.limite == true' > /dev/null 2>&1; then esperas=$((esperas + 1)); echo "espera: $(echo "$r" | head -c 200)"; sleep 60; continue; fi
            prox=$(echo "$r" | jq -r '.proxima // empty' 2>/dev/null || true)
            if [ -n "$prox" ] && [ "$prox" -gt "$parte" ]; then
              feitas=$((feitas + 1)); n=$(echo "$r" | jq -r '.produtos // 0'); produtos=$((produtos + n))
              echo "$r" | jq -c '{parte, partes, busca, fichas, produtos, batem, erro}'
            fi
            if echo "$r" | jq -e '.fim == true' > /dev/null 2>&1; then break; fi
            if [ -z "$prox" ]; then echo "sem proxima: $(echo "$r" | head -c 200)"; parte=$((parte + 1)); else parte=$prox; fi
          done
          echo "RESUMO: $feitas buscas, $produtos produtos do ML com preço nelas, $precos preços perguntados, $esperas esperas"
        env:
          CHAVE_ROBO: ${{ secrets.CHAVE_ROBO || secrets.ROBO_CHAVE }}
      - name: Amostra dos anúncios do ML
        if: ${{ inputs.fundo == '' && inputs.fundas != 'sim' }}
        run: |
          curl -sS --max-time 90 -H "Authorization: Bearer $CHAVE_ROBO" "https://vaiprocarrinho.com.br/api/preparar-ml?amostraItens=1" | jq .
        env:
          CHAVE_ROBO: ${{ secrets.CHAVE_ROBO || secrets.ROBO_CHAVE }}
