<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Página provisória enquanto o site está em construção. A loja de verdade está em previa.html -->
  <meta name="robots" content="noindex, nofollow">
  <title>Vai pro Carrinho — Em breve</title>
  <link rel="icon" href="/marca/vaiprocarrinho-icone.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      overflow: hidden;
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #5b21b6 0%, #9333ea 48%, #db2777 100%);
      color: #fff;
      line-height: 1.5;
      text-align: center;
    }

    body::before, body::after {
      content: ""; position: fixed; border-radius: 50%; filter: blur(70px);
      animation: flutuar 12s ease-in-out infinite alternate;
    }
    body::before { width: 420px; height: 420px; background: #f97316; opacity: .5; top: -160px; left: -120px; }
    body::after { width: 460px; height: 460px; background: #22d3ee; opacity: .3; bottom: -220px; right: -140px; animation-delay: -6s; }
    @keyframes flutuar { to { transform: translate(60px, 40px) scale(1.15); } }

    main { position: relative; z-index: 1; }

    .carrinho {
      width: 96px; height: 96px; margin: 0 auto 22px;
      display: grid; place-items: center; font-size: 3rem;
      border-radius: 28px; background: rgba(255, 255, 255, .16);
      border: 1px solid rgba(255, 255, 255, .3);
      animation: balancar 2.4s ease-in-out infinite;
    }
    @keyframes balancar { 50% { transform: translateY(-8px) rotate(-6deg); } }

    h1 { margin: 0; font-size: clamp(2.4rem, 8vw, 3.8rem); letter-spacing: -.035em; font-weight: 800; line-height: 1.05; }
    h1 span {
      background: linear-gradient(90deg, #fde047, #fb923c);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }

    .selo {
      display: inline-block; margin-top: 20px;
      font-size: .9rem; font-weight: 800; text-transform: uppercase; letter-spacing: .1em;
      padding: 6px 18px; border-radius: 999px;
      background: #facc15; color: #3b2a00;
    }

    p { margin: 18px auto 0; max-width: 460px; font-size: 1.08rem; opacity: .92; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <div class="carrinho" aria-hidden="true">🛒</div>
    <h1>Vai pro <span>Carrinho</span></h1>
    <span class="selo">Em breve</span>
    <p>Em breve você vai comparar os preços da Shopee, do Mercado Livre, da Amazon e de outras lojas num só lugar. Volte logo!</p>
  </main>
</body>
</html>
