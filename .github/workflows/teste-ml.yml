# Teste da API do Mercado Livre (10/11/2026): mostra o que os anúncios do ML mandam (entrega Full, parcelas) e o tamanho
# da fila do ML. Só leitura. Para rodar: aba Actions > Teste do Mercado Livre > Run workflow
name: Teste do Mercado Livre

on:
  workflow_dispatch:

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Amostra dos anúncios do ML
        run: |
          curl -sS --max-time 90 -H "Authorization: Bearer $CHAVE_ROBO" "https://vaiprocarrinho.com.br/api/preparar-ml?amostraItens=1" | jq .
        env:
          CHAVE_ROBO: ${{ secrets.CHAVE_ROBO || secrets.ROBO_CHAVE }}
