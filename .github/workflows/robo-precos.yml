# Robô de preços: todo dia de madrugada baixa os catálogos das lojas da Awin
# e atualiza o banco do site. Para rodar na hora: aba Actions > Robô de preços
# > Run workflow. O resultado aparece no resumo de cada execução.
name: Robô de preços

on:
  schedule:
    # Desde 05/11/2026 quem dispara o robô de madrugada é uma tarefa agendada do Claude (~01:14 de Brasília, pontual; o
    # agendamento do GitHub atrasava até 8 h). Este horário fica de RESERVA (06:17 de Brasília): o job "guarda" só deixa
    # rodar se ninguém disparou o robô desde 00:30 de Brasília
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      so_awin:
        description: "Só a Awin (gravar produtos das lojas), sem Shopee, buscas prontas e Lomadee"
        type: boolean
        default: false
      so_lomadee:
        description: "Só conferir as marcas da Lomadee (depois de aprovarem marcas novas)"
        type: boolean
        default: false
      so_prontas:
        description: "Só preparar as buscas prontas (depois de trocar a versão do cache da busca)"
        type: boolean
        default: false
      so_auditoria:
        description: "Só a auditoria da busca (suspeitos no topo + IA conferindo as categorias das buscas)"
        type: boolean
        default: false
      so_ml:
        description: "Só guardar os preços do Mercado Livre das buscas prontas (sem as outras lojas)"
        type: boolean
        default: false
      so_numeros:
        description: "Só o relatório Números do site (buscas, cliques, contas)"
        type: boolean
        default: false
      so_ia:
        description: "Só o robô da IA (categorias dos produtos pelo Claude Haiku)"
        type: boolean
        default: false
      so_shopee_lista:
        description: "Só a lista oficial de produtos da Shopee (feed da área de afiliados)"
        type: boolean
        default: false
      ia_limite:
        description: "IA: no máximo quantos títulos novos mandar (teste pequeno: 500)"
        type: string
        default: "300000"
      ia_esperar:
        description: "IA: minutos esperando o lote terminar (0 = lê na próxima execução)"
        type: string
        default: "0"

# 09/11/2026: os minutos grátis do GitHub acabaram (o robô gastava ~4 h por noite). Os laços longos (mercadolivre, maisvendidos,
# prontas, shopee, lomadee) agora rodam toda madrugada no "robô da noite" do Cloudflare (lib/roboNoite.js, /api/robo-noite,
# Worker relógio em robo/relogio-worker.js). Aqui eles só rodam à mão: so_ml (mercadolivre + maisvendidos), so_prontas
# (shopee + prontas) e so_lomadee. A rodada completa (sem nada marcado) faz awin, shopeelista, ia, auditoria e relatorio.
jobs:
  # Reserva (05/11/2026): no agendamento do GitHub, só roda se a tarefa do Claude não disparou o robô nesta madrugada
  # (alguma execução "workflow_dispatch" criada desde 03:30 UTC = 00:30 de Brasília). Disparado à mão: sempre roda
  guarda:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      rodar: ${{ steps.guarda.outputs.rodar }}
    steps:
      - id: guarda
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
        run: |
          if [ "$EVENTO" != "schedule" ]; then echo "rodar=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          desde=$(date -u +%Y-%m-%dT03:30:00Z)
          n=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/robo-precos.yml/runs?event=workflow_dispatch&created=%3E%3D$desde&per_page=5" \
            | jq -r '.total_count // 0' 2>/dev/null || echo 0)
          echo "Execuções disparadas desde $desde: $n"
          if [ "${n:-0}" -gt 0 ]; then
            echo "rodar=false" >> "$GITHUB_OUTPUT"
            echo "### Reserva: o robô já rodou nesta madrugada (disparado pela tarefa do Claude); nada a fazer" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "rodar=true" >> "$GITHUB_OUTPUT"
            echo "### ⚠️ Reserva: a tarefa do Claude não disparou o robô nesta madrugada; rodando pelo agendamento do GitHub" >> "$GITHUB_STEP_SUMMARY"
          fi

  awin:
    needs: guarda
    if: ${{ !inputs.so_numeros && !inputs.so_shopee_lista && !inputs.so_ml && !inputs.so_lomadee && !inputs.so_prontas && !inputs.so_auditoria && !inputs.so_ia && needs.guarda.outputs.rodar == 'true' }}
    runs-on: ubuntu-latest
    # Uma gravação por vez: duas ao mesmo tempo (madrugada atrasada + Run workflow) gravam por cima uma da outra
    concurrency:
      group: robo-awin
      cancel-in-progress: false
    timeout-minutes: 60 # 1ª vez testa ~83 mil fotos
    # Resumo para o painel (job "relatorio" no fim): o que cada passo anotou e se deu certo
    outputs:
      awin: ${{ steps.awin.outputs.awin }}
      awin_ok: ${{ steps.awin.outcome }}
      alertas: ${{ steps.alertas.outputs.alertas }}
      alertas_ok: ${{ steps.alertas.outcome }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: claude/inspiring-hamilton-wafagr
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Resultado do teste das fotos dos produtos (o robô só testa de novo depois de alguns dias)
      - uses: actions/cache/restore@v4
        with:
          path: .cache/fotos.json
          key: fotos-${{ github.run_id }}
          restore-keys: fotos-
      # Cópia do banco: o Cloudflare guarda o banco minuto a minuto por 30 dias (D1 Time Travel, plano pago). Aqui só
      # anotamos o "ponto de restauração" de antes do robô gravar, para voltar a ele se algo der errado (ver README)
      - name: Ponto de restauração do banco
        continue-on-error: true
        run: |
          r=$(curl -sS --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_DATABASE_ID/time_travel/bookmark")
          b=$(echo "$r" | grep -o '"bookmark":"[^"]*"' | cut -d'"' -f4)
          echo "### Banco antes do robô" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$b" ]; then
            echo "Ponto de restauração: $b"
            echo "- Ponto de restauração (Time Travel): \`$b\` ($(date -u '+%d/%m/%Y %H:%M') UTC)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Não deu para pegar o ponto de restauração: $r"
            echo "- ⚠️ Não deu para pegar o ponto de restauração" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      - name: Atualizar ofertas da Awin
        id: awin
        run: node --max-old-space-size=6144 robo/awin.mjs
        env:
          AWIN_FEED_KEY_PJ: ${{ secrets.AWIN_FEED_KEY_PJ }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      # Alertas de preço: com os preços da Awin já atualizados, confere os produtos com alerta e manda os e-mails
      - name: Conferir alertas de preço
        id: alertas
        if: ${{ !cancelled() }}
        env:
          CHAVE_ROBO: ${{ secrets.CHAVE_ROBO || secrets.ROBO_CHAVE }} # chave do robô (lib/robo.js); no GitHub vale um dos dois nomes
        run: |
          echo "### Alertas de preço" >> "$GITHUB_STEP_SUMMARY"
          n() { echo "$1" | jq -r "$2 // 0" 2>/dev/null | grep -E '^[0-9]+$' || echo 0; } # número de dentro da resposta
          produtos=0; emails=0; falhas=0
          for parte in $(seq 0 200); do
            r=$(curl -sS --retry 2 -H "Authorization: Bearer $CHAVE_ROBO" --max-time 90 "https://vaiprocarrinho.com.br/api/conferir-alertas?parte=$parte") || { echo "parte $parte: falhou"; falhas=$((falhas + 1)); continue; }
            echo "parte $parte: $r"
            echo "$r" | grep -q CHAVE_ROBO && exit 1 # chave recusada: falha visível (e-mail do GitHub)
            echo "- $r" >> "$GITHUB_STEP_SUMMARY"
            produtos=$((produtos + $(n "$r" .produtos))); emails=$((emails + $(n "$r" .avisos)))
            echo "$r" | grep -q '"fim":true' && break
          done
          aviso=""; [ "$falhas" -gt 0 ] && aviso="$falhas partes não responderam"
          echo "alertas=$(jq -cn --arg l "$produtos produtos com alerta conferidos; $emails e-mails \"Baixou!\" enviados" --arg a "$aviso" '{linhas: [$l], avisos: [$a | select(. != "")]}')" >> "$GITHUB_OUTPUT"
      # Guarda o teste das fotos mesmo se o robô falhar ou passar do tempo (o que já foi testado não se perde)
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/fotos.json
          key: fotos-${{ github.run_id }}

  # Lista oficial de produtos da Shopee (08/11/2026): o feed "Shopee Oficial BR" da área de afiliados (~100 mil produtos, link
  # no Secret SHOPEE_FEED_OFICIAL) vai para o banco (tabela shopee_lista); a busca soma esses produtos aos da Shopee ao vivo
  shopeelista:
    needs: guarda
    if: ${{ !inputs.so_numeros && !inputs.so_ml && !inputs.so_awin && !inputs.so_lomadee && !inputs.so_prontas && !inputs.so_auditoria && !inputs.so_ia && needs.guarda.outputs.rodar == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: robo-shopee-lista
      cancel-in-progress: false
    timeout-minutes: 45
    outputs:
      shopeelista: ${{ steps.lista.outputs.shopeelista }}
      shopeelista_ok: ${{ steps.lista.outcome }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: claude/inspiring-hamilton-wafagr
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Lista oficial de produtos da Shopee
        id: lista
        run: node --max-old-space-size=4096 robo/shopee-lista.mjs
        env:
          SHOPEE_FEED_OFICIAL: ${{ secrets.SHOPEE_FEED_OFICIAL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}

  # Shopee: o site guarda o preço de hoje dos produtos das vitrines e dos mais buscados
  # (histórico de preço e selo "Desconto real"). Roda dentro do Cloudflare, parte por parte.
  shopee:
    needs: guarda
    if: ${{ !inputs.so_numeros && !inputs.so_shopee_lista && !inputs.so_ml && !inputs.so_awin && !inputs.so_lomadee && !inputs.so_auditoria && !inputs.so_ia && needs.guarda.outputs.rodar == 'true' && inputs.so_prontas }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      shopee: ${{ steps.shopee.outputs.shopee }}
      shopee_ok: ${{ steps.shopee.outcome }}
    steps:
      - name: Guardar preços da Shopee
        id: shopee
        env:
          CHAVE_ROBO: ${{ secrets.CHAVE_ROBO || secrets.ROBO_CHAVE }} # chave do robô (lib/robo.js); no GitHub vale um dos dois nomes
        run: |
          echo "### Preços da Shopee" >> "$GITHUB_STEP_SUMMARY"
          n() { echo "$1" | jq -r "$2 // 0" 2>/dev/null | grep -E '^[0-9]+$' || echo 0; } # número de dentro da resposta
          gravados=0; erros=0; limite=0; falhas=0; feitas=0
          for parte in $(seq 0 80); do
            r=$(curl -sS --retry 2 -H "Authorization: Bearer $CHAVE_ROBO" --max-time 60 "https://vaiprocarrinho.com.br/api/coletar-precos?parte=$parte") || { echo "parte $parte: falhou"; falhas=$((falhas + 1)); continue; }
            echo "parte $parte: $r"
            echo "$r" | grep -q CHAVE_ROBO && exit 1 # chave recusada: falha visível (e-mail do GitHub)
            echo "- parte $parte: $r" >> "$GITHUB_STEP_SUMMARY"
            feitas=$((feitas + 1)); gravados=$((gravados + $(n "$r" .gravados))); erros=$((erros + $(n "$r" '(.erros | length)')))
            echo "$r" | grep -q 10030 && limite=$((limite + 1))
            echo "$r" | grep -q '"fim":true' && break
            sleep 2
          done
          aviso=""
          [ "$erros" -gt 0 ] && aviso="$erros buscas com erro na Shopee ($limite partes com o limite 10030)"
          [ "$falhas" -gt 0 ] && aviso="$aviso${aviso:+; }$falhas partes não responderam"
          echo "shopee=$(jq -cn --arg l "$gravados preços guardados para o histórico ($feitas partes)" --arg a "$aviso" '{linhas: [$l], avisos: [$a | select(. != "")]}')" >> "$GITHUB_OUTPUT"

  # Mercado Livre (04/11/2026): ele recusa ("429 local_rate_limited") quando pedimos rápido, então a busca do site trazia
  # poucos produtos dele. Aqui o robô passa devagar pelas buscas prontas (uma por chamada, um preço por vez) e guarda o
  # catálogo e os preços no banco (/api/preparar-ml); o job "prontas" vem depois e já monta as buscas com eles.
  # 1ª volta: só o que tem mais de 44 h (a madrugada anterior não alcançou); 2ª volta: mais de 20 h, se sobrar tempo.
  # Recusou: espera 1 minuto e repete a mesma busca (5 recusas seguidas = para). Para aos 50 minutos (eram 30; 05/11/2026).
  mercadolivre:
    needs: guarda
    if: ${{ !inputs.so_numeros && !inputs.so_shopee_lista && !inputs.so_awin && !inputs.so_lomadee && !inputs.so_prontas && !inputs.so_auditoria && !inputs.so_ia && needs.guarda.outputs.rodar == 'true' && (inputs.so_ml) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      ml: ${{ steps.ml.outputs.ml }}
      ml_ok: ${{ steps.ml.outcome }}
    steps:
      - name: Guardar preços do Mercado Livre
        id: ml
        env:
          CHAVE_ROBO: ${{ secrets.CHAVE_ROBO || secrets.ROBO_CHAVE }} # chave do robô (lib/robo.js); no GitHub vale um dos dois nomes
        run: |
          echo "### Mercado Livre" >> "$GITHUB_STEP_SUMMARY"
          n() { echo "$1" | jq -r "$2 // 0" 2>/dev/null | grep -E '^[0-9]+$' || echo 0; } # número de dentro da resposta
          pedir() { curl -sS --retry 2 -H "Authorization: Bearer $CHAVE_ROBO" --max-time 60 "https://vaiprocarrinho.com.br/api/preparar-ml?parte=$1&horas=$2" || echo "falhou"; }
          inicio=$(date +%s); renovadas=0; precos=0; esperas=0; partes=0; parou=""; fichas=0; ofertas=0
          # Mais vendidos do Mercado Livre (05/11/2026): "Ofertas do dia", vitrines, buscas e página da loja ML. Antes das buscas.
          # 1) Árvore das categorias (ml_categorias): lê as sub-subcategorias de 25 subcategorias por chamada, até faltar 0
          #    (na 1ª vez ~16 chamadas; depois só 1 vez por semana)
          arvore=0
          while [ "$arvore" -lt 40 ] && [ $(( $(date +%s) - inicio )) -lt 600 ]; do
            r=$(curl -sS --retry 2 -H "Authorization: Bearer $CHAVE_ROBO" --max-time 90 "https://vaiprocarrinho.com.br/api/preparar-ml?arvore=1" || echo "falhou")
            echo "árvore das categorias: $r"
            echo "$r" | grep -q CHAVE_ROBO && exit 1
            arvore=$((arvore + 1))
            if echo "$r" | grep -q '"limite":true'; then esperas=$((esperas + 1)); sleep 60; continue; fi
            [ "$(n "$r" .faltam)" -eq 0 ] && break
            sleep 1
          done
          # 0) Teste das notas do ML (05/11/2026, para a Escolha rápida): só anota no log o que cada caminho responde
          notas=$(curl -sS --retry 2 -H "Authorization: Bearer $CHAVE_ROBO" --max-time 60 "https://vaiprocarrinho.com.br/api/preparar-ml?testarNotas=1" || echo "falhou")
          echo "teste das notas do ML: $notas"
          echo "- Teste das notas do ML: $(echo "$notas" | jq -r 'if .abriu then "ABRIU (ver o log)" else "não abriu: " + ([.resultados[]? | "\(.caminho|split("?")[0]|split("/")[1:3]|join("/")) \(.token)=\(.status)"] | unique | join(", ")) end' 2>/dev/null || echo "$notas" | head -c 200)" >> "$GITHUB_STEP_SUMMARY"
          # 1b) O que mais se busca em cada categoria principal e subcategoria (ml_tendencias; 05/11/2026): 30 categorias por
          #     chamada, até faltar 0 (no máximo 8 minutos). Viram sugestões da caixa de busca, buscas prontas e buscas do ML
          tend=0; tendtermos=0; tendguardadas=0; tenderros=0
          while [ "$tend" -lt 30 ] && [ $(( $(date +%s) - inicio )) -lt 1080 ]; do
            r=$(curl -sS --retry 2 -H "Authorization: Bearer $CHAVE_ROBO" --max-time 90 "https://vaiprocarrinho.com.br/api/preparar-ml?tendencias=1" || echo "falhou")
            echo "tendências: $r"
            echo "$r" | grep -q CHAVE_ROBO && exit 1
            tend=$((tend + 1))
            if echo "$r" | grep -q '"limite":true'; then esperas=$((esperas + 1)); sleep 60; continue; fi
            tendtermos=$((tendtermos + $(n "$r" .termos))); tenderros=$((tenderros + $(n "$r" .comErro)))
            g=$(n "$r" .guardadas); [ "$g" -gt 0 ] && tendguardadas=$g
            [ "$(n "$r" .faltam)" -eq 0 ] && break
            sleep 1
          done
          echo "- Tendências do Mercado Livre: $tendtermos lidas agora, $tendguardadas guardadas ($tenderros categorias com erro)" >> "$GITHUB_STEP_SUMMARY"
          # 2) Mais vendidos das categorias principais e subcategorias (níveis 1 e 2), no máximo 25 minutos (as
          #    sub-subcategorias ficam para o job "maisvendidos", que roda junto com as buscas prontas)
          maisvendidos=0; cat=0; seguidas=0; falhas=0
          while [ $(( $(date +%s) - inicio )) -lt 1500 ]; do
            r=$(curl -sS --retry 2 -H "Authorization: Bearer $CHAVE_ROBO" --max-time 90 "https://vaiprocarrinho.com.br/api/preparar-ml?proxima=1&nivel=2" || echo "falhou")
            echo "mais vendidos: $r"
            echo "$r" | grep -q CHAVE_ROBO && exit 1
            # Resposta estranha (erro do site): 5 seguidas = desiste desta parte
            if ! echo "$r" | grep -q '"categoria"'; then falhas=$((falhas + 1)); [ "$falhas" -ge 5 ] && break; sleep 5; continue; fi; falhas=0
            if echo "$r" | grep -q '"limite":true' && [ "$seguidas" -lt 3 ]; then seguidas=$((seguidas + 1)); esperas=$((esperas + 1)); sleep 60; continue; fi
            echo "$r" | grep -q '"limite":true' && break
            seguidas=0
            echo "$r" | grep -q '"categoria":null' && break
            maisvendidos=$((maisvendidos + $(n "$r" .destaques))); cat=$((cat + 1))
            echo "$r" | grep -q '"fim":true' && break
            sleep 1
          done
          echo "- $maisvendidos mais vendidos do Mercado Livre guardados ($cat categorias principais e subcategorias)" >> "$GITHUB_STEP_SUMMARY"
          for horas in 44 20; do
            parte=0; seguidas=0
            while :; do
              if [ $(( $(date +%s) - inicio )) -gt 3000 ]; then parou="parou aos 50 minutos (volta de $horas h, busca $parte de $partes)"; break 2; fi
              r=$(pedir "$parte" "$horas")
              echo "volta $horas h, parte $parte: $r"
              echo "$r" | grep -q CHAVE_ROBO && exit 1 # chave recusada: falha visível (e-mail do GitHub)
              p=$(n "$r" .partes); [ "$p" -gt 0 ] && partes=$p
              consultas=$(n "$r" .consultas); precos=$((precos + $(n "$r" .precos)))
              fichas=$((fichas + $(n "$r" .fichasComOferta))); ofertas=$((ofertas + $(n "$r" .ofertasNasFichas)))
              [ "$consultas" -gt 0 ] && renovadas=$((renovadas + 1))
              if echo "$r" | grep -q '"limite":true'; then
                esperas=$((esperas + 1)); seguidas=$((seguidas + 1))
                if [ "$seguidas" -ge 5 ]; then parou="parou: o Mercado Livre recusou 5 vezes seguidas (busca $parte de $partes)"; break 2; fi
                sleep 60; continue
              fi
              seguidas=0
              echo "$r" | grep -q '"fim":true' && break
              # proxima: o site já pulou junto as buscas que estavam novas no banco (05/11/2026)
              prox=$(n "$r" .proxima); if [ "$prox" -gt "$parte" ]; then parte=$prox; else parte=$((parte + 1)); fi
              [ "$consultas" -gt 0 ] && sleep 1
            done
          done
          media=""; [ "$fichas" -gt 0 ] && media="$(awk "BEGIN {printf \"%.1f\", $ofertas / $fichas}") ofertas por ficha com vendedor ($fichas fichas)"
          echo "- $renovadas buscas renovadas, $precos preços guardados, $esperas esperas de 1 minuto pelo limite ${parou:+($parou)}" >> "$GITHUB_STEP_SUMMARY"
          [ -n "$media" ] && echo "- Média: $media" >> "$GITHUB_STEP_SUMMARY"
          echo "ml=$(jq -cn --arg l "$renovadas buscas renovadas, $precos preços guardados ($partes buscas)" --arg e "$esperas esperas de 1 minuto pelo limite do Mercado Livre" --arg m "$media" --arg v "$maisvendidos mais vendidos guardados ($cat categorias principais e subcategorias)" --arg t "$tendguardadas buscas mais populares do ML guardadas ($tendtermos lidas agora)" --arg te "$([ "$tenderros" -gt 0 ] && echo "Tendências: $tenderros categorias com erro (ver o log)" || true)" --arg a "$parou" '{linhas: [$v, $t, $l, $e, ($m | select(. != ""))], avisos: [$a, $te | select(. != "")]}')" >> "$GITHUB_OUTPUT"

  # Mais vendidos das ~2.700 sub-subcategorias do Mercado Livre (05/11/2026, "o máximo de produtos do ML"): depois do job
  # "mercadolivre" (que faz as principais e subcategorias), ao mesmo tempo que as buscas prontas. Revezando: as mais antigas
  # primeiro, até 75 minutos; o que não der fica para a madrugada seguinte (os produtos valem 4 dias no site). Depois, até
  # os 95 minutos, continua as buscas do Mercado Livre (as tendências de cada categoria que o job "mercadolivre" não alcançou).
  maisvendidos:
    needs: [guarda, mercadolivre]
    if: ${{ always() && !inputs.so_numeros && !inputs.so_shopee_lista && !inputs.so_awin && !inputs.so_lomadee && !inputs.so_prontas && !inputs.so_auditoria && !inputs.so_ia && needs.guarda.outputs.rodar == 'true' && (inputs.so_ml) }}
    runs-on: ubuntu-latest
    timeout-minutes: 105
    outputs:
      mv: ${{ steps.mv.outputs.mv }}
      mv_ok: ${{ steps.mv.outcome }}
    steps:
      - name: Mais vendidos das sub-subcategorias do Mercado Livre
        id: mv
        env:
          CHAVE_ROBO: ${{ secrets.CHAVE_ROBO || secrets.ROBO_CHAVE }}
        run: |
          echo "### Mais vendidos do Mercado Livre (sub-subcategorias)" >> "$GITHUB_STEP_SUMMARY"
          n() { echo "$1" | jq -r "$2 // 0" 2>/dev/null | grep -E '^[0-9]+$' || echo 0; }
          inicio=$(date +%s); total=0; cats=0; esperas=0; seguidas=0; faltam=0; parou=""; falhas=0
          while :; do
            if [ $(( $(date +%s) - inicio )) -gt 4500 ]; then parou="parou aos 75 minutos ($faltam categorias ficam para a próxima madrugada)"; break; fi
            r=$(curl -sS --retry 2 -H "Authorization: Bearer $CHAVE_ROBO" --max-time 90 "https://vaiprocarrinho.com.br/api/preparar-ml?proxima=1" || echo "falhou")
            echo "categoria $cats: $r"
            echo "$r" | grep -q CHAVE_ROBO && exit 1
            if ! echo "$r" | grep -q '"categoria"'; then
              falhas=$((falhas + 1)); [ "$falhas" -ge 5 ] && { parou="parou: o site respondeu com erro 5 vezes seguidas"; break; }; sleep 5; continue
            fi; falhas=0
            if echo "$r" | grep -q '"limite":true'; then
              esperas=$((esperas + 1)); seguidas=$((seguidas + 1))
              if [ "$seguidas" -ge 5 ]; then parou="parou: o Mercado Livre recusou 5 vezes seguidas ($faltam categorias ficam para a próxima madrugada)"; break; fi
              sleep 60; continue
            fi
            seguidas=0
            echo "$r" | grep -q '"categoria":null' && break
            total=$((total + $(n "$r" .destaques))); cats=$((cats + 1)); faltam=$(n "$r" .faltam)
            echo "$r" | grep -q '"fim":true' && break
          done
          echo "- $total mais vendidos guardados ($cats categorias), $esperas esperas de 1 minuto ${parou:+($parou)}" >> "$GITHUB_STEP_SUMMARY"
          # Buscas do Mercado Livre que faltaram (tendências das categorias), até os 95 minutos
          renovadas=0; seguidas=0; parte=0; partes=0
          while [ -z "$parou" ] && [ $(( $(date +%s) - inicio )) -lt 5700 ]; do
            r=$(curl -sS --retry 2 -H "Authorization: Bearer $CHAVE_ROBO" --max-time 60 "https://vaiprocarrinho.com.br/api/preparar-ml?parte=$parte&horas=44" || echo "falhou")
            echo "busca $parte: $r"
            p=$(n "$r" .partes); [ "$p" -gt 0 ] && partes=$p
            if echo "$r" | grep -q '"limite":true'; then
              esperas=$((esperas + 1)); seguidas=$((seguidas + 1)); [ "$seguidas" -ge 5 ] && break; sleep 60; continue
            fi
            seguidas=0
            [ "$(n "$r" .consultas)" -gt 0 ] && renovadas=$((renovadas + 1))
            echo "$r" | grep -q '"fim":true' && break
            prox=$(n "$r" .proxima); if [ "$prox" -gt "$parte" ]; then parte=$prox; else parte=$((parte + 1)); fi
          done
          echo "- $renovadas buscas do Mercado Livre renovadas depois (parou na $parte de $partes)" >> "$GITHUB_STEP_SUMMARY"
          echo "mv=$(jq -cn --arg l "$total mais vendidos guardados ($cats categorias)" --arg b "$renovadas buscas do ML renovadas depois (até a $parte de $partes)" --arg e "$esperas esperas de 1 minuto pelo limite do Mercado Livre" --arg a "$parou" '{linhas: [$l, $b, $e], avisos: [$a | select(. != "")]}')" >> "$GITHUB_OUTPUT"

  # Buscas populares prontas: refaz nas lojas as buscas mais comuns e guarda no banco, para o site responder na hora
  prontas:
    # Depois do job "shopee" (que também consulta a Shopee): os dois juntos estouravam o limite dela. E depois do
    # "mercadolivre", que deixa os preços do Mercado Livre no banco
    needs: [guarda, shopee, shopeelista, mercadolivre]
    if: ${{ always() && !inputs.so_numeros && !inputs.so_shopee_lista && !inputs.so_ml && !inputs.so_awin && !inputs.so_lomadee && !inputs.so_auditoria && !inputs.so_ia && needs.guarda.outputs.rodar == 'true' && (inputs.so_prontas) }}
    runs-on: ubuntu-latest
    timeout-minutes: 80
    outputs:
      prontas: ${{ steps.prontas.outputs.prontas }}
      prontas_ok: ${{ steps.prontas.outcome }}
    steps:
      - name: Preparar buscas populares
        id: prontas
        env:
          CHAVE_ROBO: ${{ secrets.CHAVE_ROBO || secrets.ROBO_CHAVE }} # chave do robô (lib/robo.js); no GitHub vale um dos dois nomes
        # A 1ª chamada diz quantas são ("partes"). Uma busca por vez (eram 2 ao mesmo tempo): desde 02/11/2026 a Shopee
        # recusa ("Rate limit exceeded", erro 10030) quando pedimos rápido demais e só ~35 de ~470 eram guardadas. Se ela
        # recusar, espera 1 minuto e tenta a mesma busca de novo (até 2 vezes). Para aos 70 minutos: as que faltarem
        # continuam com a resposta da véspera (vale até 7 dias). A lista vem na ordem das mais procuradas.
        run: |
          echo "### Buscas prontas" >> "$GITHUB_STEP_SUMMARY"
          pedir() { curl -sS --retry 2 -H "Authorization: Bearer $CHAVE_ROBO" --max-time 60 "https://vaiprocarrinho.com.br/api/preparar-buscas?parte=$1" || echo "falhou"; }
          r=$(pedir 0)
          echo "parte 0: $r"
          partes=$(echo "$r" | grep -o '"partes":[0-9]*' | cut -d: -f2)
          [ -z "$partes" ] && { echo "Não deu para saber quantas buscas são"; exit 1; }
          inicio=$(date +%s); parte=1; tentativas=0; guardadas=0; esperas=0; esgotou=""
          echo "$r" | grep -q '"guardada":true' && guardadas=1
          while [ "$parte" -lt "$partes" ]; do
            if [ $(( $(date +%s) - inicio )) -gt 4200 ]; then echo "Tempo esgotado na parte $parte"; esgotou=1; break; fi
            r=$(pedir "$parte")
            echo "parte $parte: $r"
            if echo "$r" | grep -q 10030 && [ "$tentativas" -lt 2 ]; then
              tentativas=$((tentativas + 1)); esperas=$((esperas + 1)); sleep 60; continue
            fi
            echo "$r" | grep -q '"guardada":true' && guardadas=$((guardadas + 1))
            tentativas=0; parte=$((parte + 1))
          done
          echo "- $guardadas de $partes buscas guardadas (feitas até a parte $parte; $esperas esperas pelo limite da Shopee)" >> "$GITHUB_STEP_SUMMARY"
          aviso=""
          [ $((guardadas * 100)) -lt $((partes * 80)) ] && aviso="Menos de 80% guardadas: as outras ficam com a resposta da véspera (até 7 dias)"
          [ -n "$esgotou" ] && aviso="$aviso${aviso:+; }parou aos 70 minutos, na busca $parte de $partes"
          echo "prontas=$(jq -cn --arg l "$guardadas de $partes buscas guardadas" --arg e "$esperas esperas de 1 minuto pelo limite da Shopee" --arg a "$aviso" '{linhas: [$l, $e], avisos: [$a | select(. != "")]}')" >> "$GITHUB_OUTPUT"

  # Lomadee: confere quais marcas mandam produtos (só essas aparecem em "Lojas parceiras" e na contagem de lojas do site)
  lomadee:
    needs: guarda
    if: ${{ !inputs.so_numeros && !inputs.so_shopee_lista && !inputs.so_ml && !inputs.so_awin && !inputs.so_prontas && !inputs.so_auditoria && !inputs.so_ia && needs.guarda.outputs.rodar == 'true' && (inputs.so_lomadee) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      lomadee: ${{ steps.lomadee.outputs.lomadee }}
      lomadee_ok: ${{ steps.lomadee.outcome }}
    steps:
      - name: Conferir marcas da Lomadee
        id: lomadee
        env:
          CHAVE_ROBO: ${{ secrets.CHAVE_ROBO || secrets.ROBO_CHAVE }} # chave do robô (lib/robo.js); no GitHub vale um dos dois nomes
        run: |
          echo "### Marcas da Lomadee com produtos" >> "$GITHUB_STEP_SUMMARY"
          : > com.txt; : > quebradas.txt; falhas=0
          for parte in $(seq 0 20); do
            r=$(curl -sS --retry 2 -H "Authorization: Bearer $CHAVE_ROBO" --max-time 300 "https://vaiprocarrinho.com.br/api/conferir-lojas?parte=$parte") || { echo "parte $parte: falhou"; falhas=$((falhas + 1)); continue; }
            echo "parte $parte: $r"
            echo "$r" | grep -q CHAVE_ROBO && exit 1 # chave recusada: falha visível (e-mail do GitHub)
            echo "- $r" >> "$GITHUB_STEP_SUMMARY"
            echo "$r" | jq -r '.comProdutos[]?' >> com.txt 2>/dev/null || true
            echo "$r" | jq -r '.linksQuebrados[]?' >> quebradas.txt 2>/dev/null || true
            echo "$r" | grep -q '"erro"' && falhas=$((falhas + 1))
            echo "$r" | grep -q '"fim":true' && break
            sleep 60 # a Lomadee aceita 60 consultas por minuto; com 25 s partes inteiras falhavam (23/10/2026)
          done
          com=$(sort -u com.txt | grep -c . || true); quebradas=$(sort -u quebradas.txt | paste -sd, - | sed 's/,/, /g')
          aviso=""
          [ -n "$quebradas" ] && aviso="Links quebrados (fora do site): $quebradas"
          [ "$falhas" -gt 0 ] && aviso="$aviso${aviso:+; }$falhas partes com erro"
          echo "lomadee=$(jq -cn --arg l "$com marcas com produtos" --arg a "$aviso" '{linhas: [$l], avisos: [$a | select(. != "")]}')" >> "$GITHUB_OUTPUT"

  # Auditoria da busca (27/10/2026): depois das buscas prontas, abre as buscas mais comuns como o visitante vê e lista
  # no resumo os produtos suspeitos no topo (de brinquedo, peça, preço fora do normal…). Não muda nada no site:
  # a lista serve para corrigir as regras da busca (lib/relevancia.js)
  auditoria:
    needs: [guarda, prontas]
    if: ${{ always() && !inputs.so_numeros && !inputs.so_shopee_lista && !inputs.so_ml && !inputs.so_awin && !inputs.so_lomadee && !inputs.so_ia && needs.guarda.outputs.rodar == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      auditoria: ${{ steps.auditoria.outputs.auditoria }}
      auditoria_ok: ${{ steps.auditoria.outcome }}
      lojas: ${{ steps.auditoria.outputs.lojas }}
      lojas_ok: ${{ steps.auditoria.outcome }}
      ia_buscas: ${{ steps.ia_buscas.outputs.ia_buscas }}
      ia_buscas_ok: ${{ steps.ia_buscas.outcome }}
      caminhos: ${{ steps.caminhos.outputs.caminhos }}
      caminhos_ok: ${{ steps.caminhos.outcome }}
      variacoes: ${{ steps.variacoes.outputs.variacoes }}
      variacoes_ok: ${{ steps.variacoes.outcome }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: claude/inspiring-hamilton-wafagr
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Auditoria da busca
        id: auditoria
        run: node robo/auditoria.mjs 150
      # IA conferindo as buscas (30/10/2026): o Claude Haiku diz se os produtos fora da categoria da busca são mesmo o
      # produto buscado; os que não são saem do meio dos resultados daquela busca (robo/conferir-buscas.mjs, lib/iaBusca.js)
      - name: Instalar o SDK da Anthropic
        run: npm install --no-save --no-package-lock @anthropic-ai/sdk@1.3.0
      - name: IA conferindo as buscas
        id: ia_buscas
        continue-on-error: true
        run: node robo/conferir-buscas.mjs 300
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      - name: Categorias das lojas
        id: caminhos
        run: node robo/caminhos.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      # Variações (04/11/2026): lojas que mandam cada tamanho/cor como anúncio; lista os que o site ainda não junta
      # num cartão só, para completar a regra de lib/variacoes.js (robo/variacoes.mjs)
      - name: Variações (tamanhos repetidos)
        id: variacoes
        continue-on-error: true
        run: node robo/variacoes.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      # Números do site (03/11/2026): buscas por dia, mais buscados, contas e alertas (robo/numeros-site.mjs)
      - name: Números do site
        if: ${{ always() }}
        continue-on-error: true
        run: node robo/numeros-site.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}

  # Robô da IA (29/10/2026): o Claude Haiku 5.5 diz a categoria de cada produto (robo/ia.mjs, lib/ia.js). Manda os títulos
  # novos num lote (Batch API, metade do preço) e lê o resultado do lote anterior. Custo e exemplos no resumo da execução
  ia:
    needs: [guarda, awin]
    if: ${{ always() && !inputs.so_numeros && !inputs.so_shopee_lista && !inputs.so_ml && !inputs.so_awin && !inputs.so_lomadee && !inputs.so_prontas && !inputs.so_auditoria && needs.guarda.outputs.rodar == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: robo-ia
      cancel-in-progress: false
    outputs:
      ia: ${{ steps.ia.outputs.ia }}
      ia_ok: ${{ steps.ia.outcome }}
      marcas: ${{ steps.marcas.outputs.marcas }}
      marcas_ok: ${{ steps.marcas.outcome }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: claude/inspiring-hamilton-wafagr
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Instalar o SDK da Anthropic
        run: npm install --no-save --no-package-lock @anthropic-ai/sdk@1.3.0
      - name: Categorias pela IA
        id: ia
        run: node robo/ia.mjs --limite "${{ inputs.ia_limite || '300000' }}" --esperar "${{ inputs.ia_esperar || '0' }}"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      # Sugestões "produto + marca" da caixa de busca (31/10/2026): lê os títulos guardados pela IA (robo/marcas.mjs)
      - name: Sugestões de produtos por marca
        id: marcas
        continue-on-error: true
        run: node robo/marcas.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}

  # Só o relatório "Números do site" (Run workflow com so_numeros): à noite ele roda no fim da auditoria
  numeros:
    needs: guarda
    if: ${{ inputs.so_numeros && needs.guarda.outputs.rodar == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: claude/inspiring-hamilton-wafagr
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Números do site
        run: node robo/numeros-site.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}

  # Resumo para o painel do Giovanni (03/11/2026): depois de todos os jobs (mesmo se algum falhar), junta o que cada
  # passo anotou e se deu certo e grava no banco (robo/relatorio.mjs, tabela robo_execucoes); aparece na aba "Robô"
  relatorio:
    needs: [guarda, awin, shopee, shopeelista, mercadolivre, maisvendidos, prontas, lomadee, auditoria, ia]
    if: ${{ always() && !inputs.so_numeros && needs.guarda.outputs.rodar == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # horários de cada job (API do GitHub)
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: claude/inspiring-hamilton-wafagr
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Resumo para o painel
        run: node robo/relatorio.mjs
        env:
          NEEDS: ${{ toJSON(needs) }}
          ENTRADAS: ${{ toJSON(inputs) }}
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
